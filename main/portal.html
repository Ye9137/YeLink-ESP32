<!doctype html>
<!-- Copyright (c) 2026 Ye；该页面嵌入固件，断网时也能完成配网。 -->
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小屏伙伴配网</title>
<style>body{background:#101724;color:#edf5ff;font:16px system-ui;max-width:450px;margin:30px auto;padding:20px}h1{color:#8ce4d2}label{display:block;margin:20px 0}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #445065;border-radius:10px;background:#202b3d;color:inherit;font:inherit;margin-top:7px}button{background:#97dfcd;color:#10261f}.check{display:flex;align-items:center;gap:10px}.check input{width:auto;margin:0}.mode{padding:2px 16px;border:1px solid #344158;border-radius:14px;background:#151e2d}p{line-height:1.7;color:#afbdd1}#status{white-space:pre-wrap}</style>
<h1>◉ ◉ 小屏伙伴</h1><p>选择设备用途。热点固定为“Ye的共享wifi”，密码 11111111。</p>
<form id="setup"><label>运行模式<select name="mode"><option value="router">单纯 Wi-Fi 路由器</option><option value="cloud">云端控制屏幕</option></select></label>
<div class="mode"><label>上游 Wi-Fi 名称<input name="ssid" maxlength="32" required autocomplete="off"></label><label>上游 Wi-Fi 密码<input name="password" type="password" maxlength="63" autocomplete="new-password" placeholder="开放网络可留空"></label></div>
<div id="routerFields" class="mode"><label class="check"><input name="sharing" type="checkbox">开启网络共享</label><p>关闭后仅保留热点和本地配置页面，不转发互联网流量。</p></div>
<div id="cloudFields" class="mode"><label>后台地址<input name="server" type="url" placeholder="https://服务器地址/esp32"></label><label>设备令牌<input name="token" type="password" maxlength="127" autocomplete="new-password" placeholder="后台地址不变时，留空保留原令牌"></label><p>保留原有字幕、照片和 GIF 云端控制，不启用路由转发。</p></div>
<button>保存并重启</button></form>
<p id="status" role="status"></p><p>配网页地址始终为 http://192.168.4.1。路由器模式仅共享 IPv4，最多连接 2 台设备。</p>
<script>
// 只回显非敏感配置；密码和令牌不从设备读回浏览器。
const form=document.getElementById('setup'),status=document.getElementById('status'),routerFields=document.getElementById('routerFields'),cloudFields=document.getElementById('cloudFields');
let initialized=false,saving=false;
function showMode(){const router=form.elements.mode.value==='router';routerFields.hidden=!router;cloudFields.hidden=router;form.elements.server.required=!router;}
form.elements.mode.onchange=showMode;
// 仅首次填入非敏感配置；随后更新联网状态，不覆盖用户正在输入的内容。
async function refresh(){if(saving)return;try{const r=await fetch('/api/info',{cache:'no-store'});const v=await r.json();if(!initialized){form.elements.ssid.value=v.ssid;form.elements.server.value=v.server;form.elements.mode.value=v.mode||'cloud';form.elements.sharing.checked=!!v.sharing_enabled;showMode();initialized=true;}status.textContent=v.subnet_conflict?'上游网段与 192.168.4.0/24 冲突，请修改上游路由器的局域网网段。':v.mode==='router'&&!v.sharing_enabled?'路由器模式已关闭网络共享；热点仅用于本地配置。':v.sharing?`路由共享已开启 · 上游 IP ${v.upstream_ip||'—'} · DNS ${v.client_dns||'未取得'} · 热点设备 ${v.clients??'—'} 台`:v.connected?(v.mode==='cloud'?'云端控制模式已连接上游 Wi-Fi。':'已连接上游 Wi-Fi，但路由共享尚未启动，请重新启动设备。'):v.wifi_error?`${v.wifi_error}（错误代码 ${v.wifi_reason}），设备会自动重试。`:'正在连接上游 Wi-Fi，请稍候；长时间无变化请重新保存名称和密码。';if(Number.isFinite(v.napt_active))status.textContent+=`\n共享连接 ${v.napt_active}/${v.napt_capacity}（TCP ${v.napt_tcp} · UDP ${v.napt_udp}） · 强制淘汰 ${v.napt_forced_evictions} 次`;if(Number.isFinite(v.udp_timeout_seconds))status.textContent+=`\nUDP 映射保持 ${v.udp_timeout_seconds} 秒 · IPv4 分片 ${v.ipv4_fragments} · 重组 ${v.ipv4_reassembled} · 入口丢弃 ${v.ipv4_fragment_input_drops}`;if(Number.isFinite(v.tcp_mss_limit))status.textContent+=`\nTCP MSS 上限 ${v.tcp_mss_limit} · 已调整握手 ${v.tcp_mss_clamped} 次 · 未建立/已结束连接空闲回收 ${v.tcp_transient_timeout_seconds} 秒`;if(v.connected&&Number.isFinite(v.wifi_rssi))status.textContent+=`\n上游信号 ${v.wifi_rssi} dBm · 信道 ${v.wifi_channel} · 带宽 ${v.wifi_bandwidth_mhz??'—'} MHz`;if(v.firmware)status.textContent+=`\n固件 ${v.firmware} · CPU ${v.cpu_mhz??'—'} MHz · 空闲内存 ${Math.round((v.heap_free||0)/1024)} KB\n本次启动：${v.reset_reason||'未知'}（${v.reset_reason_code??'—'}）`;if(Array.isArray(v.client_links))v.client_links.forEach((peer,i)=>{status.textContent+=`\n设备 ${i+1}：信号 ${peer.rssi} dBm · ${peer.supports_11n?'支持 802.11n':'仅旧版协议'}`;});}catch(e){status.textContent='无法读取设备状态，请确认手机仍连接“Ye的共享wifi”，然后打开 http://192.168.4.1。';}}
refresh();setInterval(refresh,3000);
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;saving=true;try{const data=Object.fromEntries(new FormData(form));data.sharing=form.elements.sharing.checked;const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Pet-Setup':'1'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);status.textContent='已保存，设备即将重启。请用密码 11111111 重新连接“Ye的共享wifi”，再打开 192.168.4.1 查看状态。';}catch(e){status.textContent=e.message;button.disabled=false;saving=false;}};
</script></html>
